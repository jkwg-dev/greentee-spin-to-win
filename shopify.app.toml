# Shopify app configuration (config as code). `shopify app deploy` pushes this file, so keep it
# in sync with the Dev Dashboard. Run `shopify app config link` once to fill in client_id.

client_id = ""
name = "greentee-spin-to-win"
handle = "greentee-spin-to-win"
application_url = "https://REPLACE.example.com"
# No admin UI. The app serves API endpoints, an app proxy and extensions only.
embedded = false

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# write_orders: order lookup plus writing the greentee_spin.result order metafield
# (metafieldsSet needs write access to the owner resource; write includes read).
# write_discounts: discountCodeBasicCreate, and reading a code back on a duplicate.
scopes = "write_orders,write_discounts"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://REPLACE.example.com/auth/callback"]

[app_proxy]
# Storefront https://{shop}/apps/spin/* -> {application_url}/apps/spin/*
url = "https://REPLACE.example.com/apps/spin"
prefix = "apps"
subpath = "spin"

[webhooks]
api_version = "2026-07"
